{% extends "base.html" %}

{% block title %}登录 | 人口趋势与分析管理系统{% endblock %}

{% block content %}
<section class="login-panel">
    <div class="login-copy">
        <p class="eyebrow">Population Trend Analysis</p>
        <h1>人口趋势与分析管理系统</h1>
        <p>使用本地 Web 页面完成登录、查询、分析、导出与可视化。适合课程设计答辩直接演示。</p>
        <div class="info-grid">
            <div>
                <span>默认管理员</span>
                <strong>admin / admin123</strong>
            </div>
            <div>
                <span>默认访客</span>
                <strong>viewer / viewer123</strong>
            </div>
        </div>
    </div>
    <form method="post" class="login-card">
        <h2>账号登录</h2>
        <label>
            <span>用户名</span>
            <input type="text" name="username" placeholder="请输入用户名" autocomplete="username" required>
        </label>
        <label>
            <span>密码</span>
            <input type="password" name="password" placeholder="请输入密码" autocomplete="current-password" required>
        </label>
        <button type="submit" class="primary-button">进入系统</button>
    </form>
</section>
{% endblock %}
