{% extends "base.html" %}
{% import "_metric_help.html" as mh %}

{% block page_title %}图表中心{% endblock %}

{% block head_extra %}
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
{% endblock %}

{% block content %}
<section class="panel">
    <div class="panel-header">
        <div>
            <h3>交互式图表</h3>
        </div>
    </div>
</section>

<section class="chart-grid">
    <article class="panel">
        <div class="panel-header">
            <div>
                <h3>趋势折线图</h3>
            </div>
        </div>
        <form class="chart-form" data-endpoint="{{ url_for('chart_trend_api') }}" data-target="trend-chart">
            <label>
                <span>地区 <button type="button" class="help-dot" data-tip="选择全国时使用 1950-2025 全国长序列；选择省份时使用省级年度数据。">?</button></span>
                <select name="region">
                    {% for region in region_options %}
                    <option value="{{ region }}" {% if region == default_region %}selected{% endif %}>{{ region }}</option>
                    {% endfor %}
                </select>
            </label>
            <label>
                <span>指标 {{ mh.help('metric') }}</span>
                <select name="metric">
                    {% for metric, label in metric_options.items() %}
                    <option value="{{ metric }}" {% if metric == 'total_population' %}selected{% endif %}>{{ label }}</option>
                    {% endfor %}
                </select>
            </label>
            <label>
                <span>显示方式 {{ mh.help('relative_mode') }}</span>
                <select name="mode">
                    <option value="relative" selected>相对变化（推荐）</option>
                    <option value="absolute">实际值</option>
                </select>
            </label>
        </form>
        <div id="trend-chart" class="chart-surface"></div>
    </article>

    <article class="panel">
        <div class="panel-header">
            <div>
                <h3>年度柱状图</h3>
            </div>
        </div>
        <form class="chart-form" data-endpoint="{{ url_for('chart_bar_api') }}" data-target="bar-chart">
            <label>
                <span>年份 <button type="button" class="help-dot" data-tip="年度柱状图展示同一年各省级地区对比，当前省级表覆盖 2015-2024。">?</button></span>
                <select name="year">
                    {% for year in year_options %}
                    <option value="{{ year }}" {% if year == default_year %}selected{% endif %}>{{ year }}</option>
                    {% endfor %}
                </select>
            </label>
            <label>
                <span>指标 {{ mh.help('metric') }}</span>
                <select name="metric">
                    {% for metric, label in metric_options.items() %}
                    <option value="{{ metric }}" {% if metric == 'total_population' %}selected{% endif %}>{{ label }}</option>
                    {% endfor %}
                </select>
            </label>
            <label>
                <span>排序字段 {{ mh.help('ranking') }}</span>
                <select name="sort_by">
                    <option value="value" selected>按数值</option>
                    <option value="name">按地区首字母</option>
                </select>
            </label>
            <label>
                <span>排序方式</span>
                <select name="sort_order">
                    <option value="desc" selected>降序</option>
                    <option value="asc">升序</option>
                </select>
            </label>
        </form>
        <div id="bar-chart" class="chart-surface"></div>
    </article>

    <article class="panel">
        <div class="panel-header">
            <div>
                <h3>性别结构饼图</h3>
            </div>
        </div>
        <form class="chart-form" data-endpoint="{{ url_for('chart_gender_api') }}" data-target="gender-chart">
            <label>
                <span>地区</span>
                <select name="region">
                    {% for region in region_options %}
                    <option value="{{ region }}" {% if region == default_region %}selected{% endif %}>{{ region }}</option>
                    {% endfor %}
                </select>
            </label>
            <label>
                <span>年份</span>
                <select name="year">
                    {% for year in year_options %}
                    <option value="{{ year }}" {% if year == default_year %}selected{% endif %}>{{ year }}</option>
                    {% endfor %}
                </select>
            </label>
        </form>
        <div id="gender-chart" class="chart-surface"></div>
    </article>
</section>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/charts.js') }}"></script>
{% endblock %}
