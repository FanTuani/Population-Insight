{% extends "base.html" %}

{% block page_title %}用户管理{% endblock %}

{% block content %}
<section class="panel">
    <div class="panel-header">
        <div>
            <p class="eyebrow">Users</p>
            <h3>系统用户</h3>
        </div>
    </div>
    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>用户名</th>
                    <th>角色</th>
                    <th>创建时间</th>
                </tr>
            </thead>
            <tbody>
                {% for user in users %}
                <tr>
                    <td>{{ user.id }}</td>
                    <td>{{ user.username }}</td>
                    <td><span class="status-tag status-info">{{ '系统管理员' if user.role == 'admin' else '普通用户' }}</span></td>
                    <td>{{ user.created_at }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</section>
{% endblock %}
